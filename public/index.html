<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Forum</h1>
<div id="login-section">
  <button id="guestBtn">Continue as Guest</button>
  <input type="text" id="username" placeholder="Username">
  <input type="file" id="avatarUpload" accept="image/*">
  <button id="createAccount">Create Account</button>
  <img id="avatarPreview" src="" style="display:none;width:100px;height:100px;border-radius:50%;margin:10px auto;"/>
</div>
<div id="forum-section" style="display:none">
<textarea id="postText" placeholder="Write..."></textarea>
<button id="postBtn">Post</button>
<div id="postsContainer"></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
